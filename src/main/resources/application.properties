spring.application.name=Diploma
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/migration/migration.xml
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/diplomadb
spring.datasource.username=diploma_user
spring.datasource.password=diploma_password
security.jwt.secret=change-me-to-a-long-secret-key-at-least-32-characters
security.jwt.expiration-ms=604800000
app.seed.images.enabled=true
app.seed.images.dir=D:\\projects\\Diploma\\src\\main\\resources\\car_images
app.seed.images.max-width=1280
app.seed.images.max-height=720
app.seed.images.jpeg-quality=0.82
security.rsa.private-key=-----BEGIN PRIVATE KEY-----\\n-----END PRIVATE KEY-----

